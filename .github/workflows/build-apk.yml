name: Build APK

on:
  push:
    branches: [main, mejoras-ux]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Correr tests
        run: flutter test

      - name: Compilar APK (release, sin firmar con keystore propio)
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-contabilidad-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publicar APK en Releases (para descargarlo directo desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk app-contabilidad.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" app-contabilidad.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK más reciente (${GITHUB_REF_NAME})" \
            --notes "APK compilado automáticamente desde la rama ${GITHUB_REF_NAME}."
