name: Build APK

on:
  push:
    branches: [main, mejoras-ux]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Verificar que la versión de la app coincide con pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          grep -q "kAppVersion = '$VERSION'" lib/core/app_version.dart || {
            echo "kAppVersion no coincide con la versión de pubspec.yaml ($VERSION)"; exit 1; }

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          grep -E "^\s*(error|warning|info) " analyze.txt | while IFS= read -r line; do echo "::error::$line"; done
          cat analyze.txt
          exit $code

      - name: Correr tests
        run: flutter test

      - name: Compilar APK (release, sin firmar con keystore propio)
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-contabilidad-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publicar APK en Releases (para descargarlo directo desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v${VERSION}"
          cp build/app/outputs/flutter-apk/app-release.apk "contabilidad-${TAG}.apk"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "contabilidad-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Contabilidad ${TAG}" \
            --notes "APK de Contabilidad personal versión ${VERSION}, compilado desde la rama ${GITHUB_REF_NAME}."
